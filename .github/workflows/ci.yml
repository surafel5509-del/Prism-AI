name: Verify Prism AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NVIDIA_API_KEY: ci-placeholder
          NVIDIA_MODEL: z-ai/glm-5.3-flash
